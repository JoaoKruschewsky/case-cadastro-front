<div class="login-page">
  <div class="form">
    <div class="profile-form">
      <h2 class="profile-title">Bem-vindo!</h2>

      <div class="profile-field">
        <span class="profile-label">Nome</span>
        <span class="profile-value">{{ name }}</span>
      </div>

      <div class="profile-field">
        <span class="profile-label">Login</span>
        <span class="profile-value login-badge">{{ login }}</span>
      </div>

      <button (click)="navigateLogin()">Sair</button>
    </div>
  </div>

  
</div>
